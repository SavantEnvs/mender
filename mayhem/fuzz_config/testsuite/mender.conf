{
  "ServerURL": "https://docker.mender.io",
  "Servers": [{"ServerURL": "https://a.example"}, {"ServerURL": "https://b.example"}],
  "TenantToken": "dummy",
  "ServerCertificate": "/etc/mender/server.crt",
  "UpdatePollIntervalSeconds": 1800,
  "InventoryPollIntervalSeconds": 28800,
  "RetryPollIntervalSeconds": 300,
  "RetryPollCount": 5,
  "StateScriptTimeoutSeconds": 120,
  "ModuleTimeoutSeconds": 14400,
  "ArtifactVerifyKeys": ["/etc/mender/a.pem"],
  "DeviceTypeFile": "/var/lib/mender/device_type",
  "DeviceTier": "standard",
  "SkipVerify": false,
  "DBus": {"Enabled": true},
  "Connectivity": {"DisableKeepAlive": true, "IdleConnTimeoutSeconds": 10},
  "HttpsClient": {"Certificate": "c.pem", "Key": "k.pem", "SSLEngine": "e"},
  "Security": {"AuthPrivateKey": "k", "SSLEngine": "e"},
  "UpdateLogPath": "/var/lib/mender",
  "DaemonLogLevel": "info"
}
